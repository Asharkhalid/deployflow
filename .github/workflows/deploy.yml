name: DeployFlow CI/CD

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sample-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore src/SampleApi/SampleApi.csproj

      - name: Build
        run: dotnet build src/SampleApi/SampleApi.csproj --no-restore -c Release

      - name: Test
        run: dotnet test src/SampleApi/SampleApi.csproj --no-build --verbosity normal -c Release

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Requires GitHub Secrets: SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY
    
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Copy scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "scripts/"
          target: "/home/${{ secrets.SERVER_USER }}/apps/sample-api/"

      - name: Execute deployment script via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHA: ${{ github.sha }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SHA,REGISTRY,IMAGE_NAME,GHCR_PAT,ACTOR
          script: |
            # Login to GHCR to guarantee pull access
            echo "$GHCR_PAT" | docker login $REGISTRY -u $ACTOR --password-stdin
            
            # Ensure scripts are executable
            chmod +x /home/${{ secrets.SERVER_USER }}/apps/sample-api/scripts/*.sh
            
            # Formulate the image name based on the git SHA tag
            SHORT_SHA=${SHA:0:7}
            IMAGE_TAG=sha-${SHORT_SHA}
            
            # Docker requires lowercase repository names
            LOWERCASE_IMAGE=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
            FULL_IMAGE_NAME="${REGISTRY}/${LOWERCASE_IMAGE}:$IMAGE_TAG"
            
            echo "Initiating deployment of: $FULL_IMAGE_NAME"
            
            # Execute the orchestrator
            bash /home/${{ secrets.SERVER_USER }}/apps/sample-api/scripts/deploy.sh "$FULL_IMAGE_NAME"
