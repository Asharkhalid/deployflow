<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DeployFlow Thumbnail</title>
<style>
  :root{
    --navy:#12243d; --navy-2:#182f4d; --line:#35507a;
    --teal:#5fd0dd; --accent:#0d7d8c; --mute:#a7bdd6;
    --red:#f28b6b; --white:#ffffff;
    --sans:"Segoe UI",Inter,-apple-system,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1600px;height:1200px;background:var(--navy);overflow:hidden}
  body{font-family:var(--sans);color:var(--white);padding:96px 100px;display:flex;flex-direction:column}
  .kicker{font-size:34px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700}
  h1{font-size:92px;line-height:1.05;letter-spacing:-2px;font-weight:700;margin-top:22px}
  .flow{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr) 70px minmax(0,1fr) 70px minmax(0,1fr);
        grid-template-rows:170px auto;margin-top:100px}
  .box{border:3px solid var(--line);background:var(--navy-2);border-radius:18px;
       display:flex;align-items:center;justify-content:center;text-align:center;
       font-size:42px;font-weight:700;line-height:1.15;padding:0 16px}
  .box.gate{background:var(--accent);border-color:#12a3b5}
  .arr{display:flex;align-items:center;justify-content:center;font-size:54px;color:var(--teal);font-weight:700}
  .fail{grid-column:4/7;display:flex;flex-direction:column;align-items:center}
  .drop{width:4px;height:56px;background:var(--red)}
  .fail .txt{font-size:38px;font-weight:700;color:var(--red);white-space:nowrap;margin-top:8px}
  .fail .txt span{color:var(--mute);font-weight:600}
  .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
  .rb{font-size:50px;font-weight:700}
  .rb b{color:var(--teal)}
  .stack{font-size:32px;color:var(--mute);font-weight:600;text-align:right;line-height:1.4}
</style>
</head>
<body>
  <div class="kicker">DeployFlow</div>
  <h1>Blue-green deploys for<br>ASP.NET Core on one VPS</h1>

  <div class="flow">
    <div class="box">git push</div><div class="arr">&rarr;</div>
    <div class="box">Build &amp; test</div><div class="arr">&rarr;</div>
    <div class="box gate">Health check &#10003;</div><div class="arr">&rarr;</div>
    <div class="box">Traffic switch</div>
    <div class="fail">
      <div class="drop"></div>
      <div class="txt">&#10007; Fails? <span>Live site untouched</span></div>
    </div>
  </div>

  <div class="bottom">
    <div class="rb"><b>&#8634;</b> One-command rollback</div>
    <div class="stack">GitHub Actions &middot; Docker<br>Nginx &middot; .NET 8</div>
  </div>
</body>
</html>
