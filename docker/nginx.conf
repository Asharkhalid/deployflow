events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Include the dynamically managed upstream configuration.
    # switch-release.sh and rollback.sh regenerate this file to point at the active container.
    include /etc/nginx/conf.d/sample-api_upstream.conf;

    server {
        listen 80;
        
        # Replace with your actual domain in production
        server_name _;

        location / {
            proxy_pass http://deployflow_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
